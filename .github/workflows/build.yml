name: Acceptance tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  # Run by hand, optionally against other images of the API and the UI (feature images: pr-<N>)
  workflow_dispatch:
    inputs:
      api_tag:
        description: 'build-bro-api image tag: main, pr-<N>, sha-<7> or a release X.Y.Z'
        default: main
      ui_tag:
        description: 'build-bro-ui image tag: main, pr-<N>, sha-<7> or a release X.Y.Z'
        default: main
  # Nightly, to catch breaking changes merged into the API or the UI
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

# Runs the suite against the published images of the API and the UI (#16): support/stack.ts starts them
# and a throwaway MariaDB with Testcontainers (Docker is preinstalled on ubuntu-latest). No checkout of the
# other repos, no JDK.
# Actions are pinned to full commit SHAs (a tag can be moved to other code); the comment names the version.
jobs:
  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_IMAGE: ghcr.io/esistegalaber/build-bro-api:${{ inputs.api_tag || 'main' }}
      UI_IMAGE: ghcr.io/esistegalaber/build-bro-ui:${{ inputs.ui_tag || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      # Warnings fail CI too (waitForTimeout, skipped tests, ...)
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Acceptance tests
        run: npx playwright test

      # "A run names what it tested": the image references and digests support/stack.ts wrote
      - name: Images under test
        if: ${{ !cancelled() && hashFiles('container-logs/images.md') != '' }}
        run: cat container-logs/images.md >> "$GITHUB_STEP_SUMMARY"

      # The report, plus the API's and the UI's logs (container-logs/)
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            container-logs/
          retention-days: 14
